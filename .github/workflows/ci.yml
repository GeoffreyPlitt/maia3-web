name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:weights
      - name: Package
        run: npm pack --dry-run

  reproduce-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Fetch pinned upstream code and checkpoint
        run: tools/fetch_upstream.sh upstream
      - name: Install export dependencies (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r tools/requirements.txt
      - name: Export and compare with the manifest
        run: |
          python tools/export_weights.py upstream/maia3 upstream/maia3-5m.pt out int8 --weights-only
          node tools/verify_weights.mjs out/maia3-5m.int8.bin
